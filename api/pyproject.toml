[project]
name = "football-poc-api"
version = "0.1.0"
requires-python = ">=3.12"
# Runtime deps are pinned in requirements.txt, test deps in requirements-dev.txt.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
